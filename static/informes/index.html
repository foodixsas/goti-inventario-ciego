<style>
:root{--bg:#d6e4f0;--card:#fff;--border:#a8c8e8;--border2:#c8ddf0;

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);

.card:hover,.card:focus{border-color:var(--blue);box-shadow:0 2px 10px rgba(43,108,176,.14);outline:none}
.sem{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);font-weight:600}
.rango{display:block;font-size:17px;font-weight:600;margin:2px 0 6px}
.ver{display:block;font-size:13px;color:var(--blue);font-weight:500}
