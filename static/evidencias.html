<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidencias - FOODIX</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --linea:#e2e8f0; --gris:#64748b; --fondo:#f8fafc; --primario:#1d4ed8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Poppins,system-ui,sans-serif; background:var(--fondo); color:#0f172a; }
  header { background:#fff; border-bottom:1px solid var(--linea); padding:16px 24px;
           position:sticky; top:0; z-index:20; }
  .fila { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; font-weight:600; }
  .pestanas { display:flex; gap:8px; }
  .pestana { padding:6px 14px; border-radius:999px; border:1px solid var(--linea);
             background:#fff; cursor:pointer; font-size:13px; font-family:inherit; }
  .pestana.activa { background:var(--primario); color:#fff; border-color:var(--primario); }
  #buscar { flex:1; min-width:220px; padding:9px 14px; border:1px solid #cbd5e1;
            border-radius:8px; font-size:14px; font-family:inherit; }
  #conteo { color:var(--gris); font-size:13px; }

  main { padding:20px 24px 60px; }
  .rejilla { display:grid; gap:16px;
             grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
  .ficha { background:#fff; border:1px solid var(--linea); border-radius:12px;
           overflow:hidden; display:flex; flex-direction:column; }
  .ficha .foto { width:100%; height:180px; object-fit:cover; background:#f1f5f9;
                 cursor:zoom-in; display:block; }
  .ficha .cuerpo { padding:12px 14px; }
  .ficha h3 { margin:0 0 4px; font-size:14px; font-weight:600; line-height:1.3; }
  .ficha .cod { font-family:ui-monospace,monospace; font-size:11px; color:var(--primario); }
  .ficha dl { margin:8px 0 0; font-size:12px; color:var(--gris); line-height:1.6; }
  .ficha dl b { color:#0f172a; font-weight:500; }
  .mas { font-size:11px; color:var(--gris); padding:0 14px 10px; }

  .paginas { display:flex; gap:8px; justify-content:center; margin-top:28px; }
  .paginas button { padding:8px 16px; border:1px solid var(--linea); background:#fff;
                    border-radius:8px; cursor:pointer; font-family:inherit; font-size:13px; }
  .paginas button[disabled] { opacity:.4; cursor:default; }

  #visor { position:fixed; inset:0; background:rgba(15,23,42,.92); display:none;
           align-items:center; justify-content:center; z-index:50; padding:24px; }
  #visor img { max-width:100%; max-height:100%; object-fit:contain; }
  #visor .cerrar { position:absolute; top:18px; right:24px; color:#fff; font-size:28px;
                   cursor:pointer; background:none; border:none; }
  #visor .pie { position:absolute; bottom:18px; left:0; right:0; text-align:center;
                color:#e2e8f0; font-size:13px; }
  .vacio { text-align:center; color:var(--gris); padding:60px 20px; }
</style>
</head>
<body>

<header>
  <div class="fila">
    <h1><i class="fas fa-images"></i> <span id="titulo">Evidencias</span></h1>
    <div class="pestanas">
      <button class="pestana" data-g="equipos">Equipos y Mobiliario</button>
      <button class="pestana" data-g="caja-chica">Caja Chica</button>
    </div>
    <input id="buscar" placeholder="Buscar por codigo, nombre, marca, responsable...">
    <span id="conteo"></span>
  </div>
</header>

<main>
  <div class="rejilla" id="rejilla"></div>
  <div class="paginas">
    <button id="anterior">&larr; Anterior</button>
    <button id="siguiente">Siguiente &rarr;</button>
  </div>
</main>

<div id="visor">
  <button class="cerrar">&times;</button>
  <img id="visor-img" alt="">
  <div class="pie" id="visor-pie"></div>
</div>

<script>
const ETIQUETAS = {
  equipos:      [['marca','Marca'],['modelo','Modelo'],['serie','Serie'],
                 ['categoria','Categoria'],['responsable','Responsable']],
  'caja-chica': [['marca','Proveedor'],['modelo','Centro de costo'],['serie','Documento'],
                 ['categoria','Grupo'],['responsable','Fecha']]
};

let galeria = document.body.dataset.galeria || 'equipos';
let pagina = 1, total = 0, limite = 60, temporizador = null;

const $ = id => document.getElementById(id);

async function cargar() {
  const q = $('buscar').value.trim();
  const r = await fetch(`/api/evidencias/${galeria}?pagina=${pagina}&limite=${limite}`
                        + (q ? `&q=${encodeURIComponent(q)}` : ''));
  const d = await r.json();
  if (!d.success) { $('rejilla').innerHTML = `<div class="vacio">${d.error}</div>`; return; }

  total = d.total;
  $('titulo').textContent = d.titulo;
  document.title = d.titulo + ' - FOODIX';
  const desde = (pagina - 1) * limite + 1;
  $('conteo').textContent = total
      ? `${desde}-${Math.min(pagina * limite, total)} de ${total} con foto`
      : 'Sin resultados';

  if (!d.registros.length) {
    $('rejilla').innerHTML = '<div class="vacio">No hay registros con foto para esa busqueda</div>';
  } else {
    const campos = ETIQUETAS[galeria] || [];
    $('rejilla').innerHTML = d.registros.map(x => {
      const rutas = x.rutas || [];
      const detalle = campos.filter(([k]) => x[k])
                            .map(([k, et]) => `<div>${et}: <b>${x[k]}</b></div>`).join('');
      return `<article class="ficha">
        <img class="foto" loading="lazy"
             src="/evidencias/foto?ancho=520&r=${encodeURIComponent(rutas[0] || '')}"
             data-full="${encodeURIComponent(rutas[0] || '')}"
             data-pie="${(x.codigo || '') + ' - ' + (x.titulo || '')}" alt="">
        <div class="cuerpo">
          <h3>${x.titulo || '(sin nombre)'}</h3>
          <span class="cod">${x.codigo || ''}</span>
          <dl>${detalle}</dl>
        </div>
        ${rutas.length > 1 ? `<div class="mas">+ ${rutas.length - 1} foto(s) mas</div>` : ''}
      </article>`;
    }).join('');
  }

  $('anterior').disabled  = pagina <= 1;
  $('siguiente').disabled = pagina * limite >= total;
  document.querySelectorAll('.pestana').forEach(b =>
      b.classList.toggle('activa', b.dataset.g === galeria));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('click', e => {
  const foto = e.target.closest('.foto');
  if (foto) {
    $('visor-img').src = '/evidencias/foto?ancho=1800&r=' + foto.dataset.full;
    $('visor-pie').textContent = foto.dataset.pie;
    $('visor').style.display = 'flex';
    return;
  }
  if (e.target.closest('#visor')) { $('visor').style.display = 'none'; $('visor-img').src = ''; }
  const pes = e.target.closest('.pestana');
  if (pes) { galeria = pes.dataset.g; pagina = 1; $('buscar').value = ''; cargar(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { $('visor').style.display = 'none'; $('visor-img').src = ''; }
});

$('buscar').addEventListener('input', () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => { pagina = 1; cargar(); }, 300);
});
$('anterior').addEventListener('click',  () => { if (pagina > 1) { pagina--; cargar(); } });
$('siguiente').addEventListener('click', () => { if (pagina * limite < total) { pagina++; cargar(); } });

galeria = '{{GALERIA}}';
cargar();
</script>
</body>
</html>
